---
# Ansible collection dependencies. Install with:
#
#   ansible-galaxy install -r requirements.yml
#
# Requires ansible-core >= 2.18 when targeting Fedora 41+ or any other
# host where dnf5 is the package manager — that's the release where
# ansible.builtin.package learned to dispatch to the dnf5 module.
#
# Cloud collections are required only when openzro_cloud != "none".
# A bare-metal-only deployment can skip them — they're large and
# pull a lot of Python deps. To filter:
#
#   ansible-galaxy install -r requirements.yml \
#       -p ./collections \
#       --skip-cloud   # alias defined per-operator's wrapper

collections:
  # AWS — needed only when openzro_cloud == "aws".
  - name: amazon.aws
    version: ">=7.0.0"
  - name: community.aws
    version: ">=7.0.0"

  # GCP — needed only when openzro_cloud == "gcp".
  - name: google.cloud
    version: ">=1.3.0"

  # community.crypto — used by openzro_nginx for self-signed cert
  # generation when openzro_tls_mode == "self_signed". Optional for
  # production where certbot handles cert lifecycle.
  - name: community.crypto
    version: ">=2.0.0"

  # ansible.posix — three modules, all in the always-install tier:
  #   sysctl     openzro_routing_peer (IPv4 + IPv6 forwarding)
  #   firewalld  common, opening the stack's ports on RHEL/Fedora
  #   seboolean  common, httpd_can_network_connect for nginx
  # The last two no-op on hosts without firewalld / SELinux, but the
  # collection still has to be present for the tasks to parse.
  - name: ansible.posix
    version: ">=1.5.0"
