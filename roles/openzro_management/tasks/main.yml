---
# One `package` task rather than an apt task plus a dnf task gated on
# ansible_pkg_mgr: Fedora 41+ reports `dnf5`, which matched neither
# gate, and ansible.builtin.dnf itself needs the dnf4 Python bindings
# that a current Fedora no longer ships. `package` dispatches to the
# right module (apt / dnf / dnf5 / pacman) on its own. The version-pin
# separator comes from vars/main.yml.
#
# `package` has no update_cache, which the per-manager modules did.
# The repo-add task in `common` carries it, and `common` runs first in
# both site.yml and update.yml, so the cache is fresh as of this play.
# The one gap is a re-run within cache_valid_time (3600s) of a fresh
# publish: the new version resolves against a stale index. Pass
# `-e openzro_force_cache_update=true`, or refresh by hand, if you are
# chasing a package published minutes ago.
- name: Install openzro-management package
  ansible.builtin.package:
    name: "{{ openzro_management_pkg_spec }}"
    state: present
  notify: restart openzro-management

- name: Ensure openzro data dir exists
  ansible.builtin.file:
    path: "{{ openzro_management_data_dir }}"
    state: directory
    owner: openzro
    group: openzro
    mode: "0750"

- name: Look up existing DataStoreEncryptionKey on host
  ansible.builtin.slurp:
    src: "{{ openzro_management_data_dir }}/.encryption-key"
  register: openzro_existing_key
  failed_when: false
  changed_when: false

- name: Generate DataStoreEncryptionKey on first install
  ansible.builtin.shell: |
    set -euo pipefail
    head -c 32 /dev/urandom | base64 > {{ openzro_management_data_dir }}/.encryption-key
    chown openzro:openzro {{ openzro_management_data_dir }}/.encryption-key
    chmod 0400              {{ openzro_management_data_dir }}/.encryption-key
  args:
    creates: "{{ openzro_management_data_dir }}/.encryption-key"
  when: openzro_existing_key.content is not defined

- name: Re-read DataStoreEncryptionKey post-generation
  ansible.builtin.slurp:
    src: "{{ openzro_management_data_dir }}/.encryption-key"
  register: openzro_key_blob

- name: Stash decoded key for the template
  ansible.builtin.set_fact:
    openzro_management_datastore_key: "{{ openzro_key_blob.content | b64decode | trim }}"

- name: Render management.json from template
  ansible.builtin.template:
    src: management.json.j2
    dest: "{{ openzro_management_config_path }}"
    owner: openzro
    group: openzro
    mode: "0640"
    backup: true
  notify: restart openzro-management

- name: Render systemd EnvironmentFile
  ansible.builtin.template:
    src: openzro-management.env.j2
    dest: "{{ openzro_management_env_file }}"
    owner: root
    group: openzro
    mode: "0640"
    backup: true
  notify: restart openzro-management

- name: Enable + start openzro-management
  ansible.builtin.systemd:
    name: "{{ openzro_management_service }}"
    enabled: true
    state: started
    daemon_reload: true
