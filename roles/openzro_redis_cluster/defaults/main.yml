---
# Redis (master/replica) installed across management hosts. Used
# as an alternative to embedded NATS / standalone NATS — operators
# already running Redis-based observability often prefer this for
# ops consistency.
#
# Topology: first management host is master, rest are replicas.
# Sentinel-based automatic failover is NOT wired here — for that,
# use a managed Redis (Elasticache / Memorystore) and skip this
# role. This role is "good enough for two-replica HA with manual
# promotion" — appropriate for stage / small prod.

# Three different packagings of the same thing:
#
#   Debian/Ubuntu   redis-server, service redis-server,
#                   /etc/redis/redis.conf
#   RHEL/Rocky/Alma redis from AppStream, service redis, same config
#                   path but the package/service name loses the
#                   `-server` suffix
#   Fedora          NO redis at all — Fedora dropped it over the
#                   licence change and ships valkey, the BSD fork, in
#                   its place. Same wire protocol and same config
#                   syntax, different names and paths throughout.
#
# The management coordinator talks the Redis protocol, so valkey is a
# drop-in as far as openzro is concerned. Override any of these when
# you're running a build that doesn't match your distro's default —
# e.g. valkey from a third-party repo on EL.
openzro_redis_flavour: "{{ 'valkey' if ansible_distribution == 'Fedora' else 'redis' }}"

openzro_redis_package: >-
  {{ 'valkey' if openzro_redis_flavour == 'valkey'
     else ('redis-server' if ansible_os_family == 'Debian' else 'redis') }}
openzro_redis_service: >-
  {{ 'valkey' if openzro_redis_flavour == 'valkey'
     else ('redis-server' if ansible_os_family == 'Debian' else 'redis') }}
openzro_redis_user: "{{ openzro_redis_flavour }}"
openzro_redis_group: "{{ openzro_redis_flavour }}"
openzro_redis_data_dir: "/var/lib/{{ openzro_redis_flavour }}"
openzro_redis_config_path: >-
  {{ '/etc/valkey/valkey.conf' if openzro_redis_flavour == 'valkey'
     else '/etc/redis/redis.conf' }}

openzro_redis_port: 6379
openzro_redis_bind: 0.0.0.0   # listen on all interfaces; firewall gates access

# Master is whichever management host the inventory lists FIRST
# in the `management` group — pick deterministically, document
# in inventory comments. No magic auto-failover.
openzro_redis_master_host: "{{ groups['management'][0] }}"
openzro_redis_is_master: "{{ inventory_hostname == openzro_redis_master_host }}"

# Auth — required when binding to non-loopback. Operator vault-
# encrypts in inventories/*/group_vars/all.yml.
openzro_redis_password: ""
