---
# `package` rather than apt/dnf tasks gated on ansible_pkg_mgr —
# see the comment in roles/openzro_management/tasks/main.yml for why
# (Fedora 41+ reports `dnf5` and matched neither gate).
- name: Install openzro-signal package
  ansible.builtin.package:
    name: "{{ openzro_signal_pkg_spec }}"
    state: present
  notify: restart openzro-signal

- name: Render systemd EnvironmentFile
  ansible.builtin.template:
    src: openzro-signal.env.j2
    dest: "{{ openzro_signal_env_file }}"
    owner: root
    group: openzro
    mode: "0640"
    backup: true
  notify: restart openzro-signal

- name: Enable + start openzro-signal
  ansible.builtin.systemd:
    name: "{{ openzro_signal_service }}"
    enabled: true
    state: started
    daemon_reload: true
