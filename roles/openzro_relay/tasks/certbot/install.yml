---
# Install certbot + the provider's DNS plugin. Three distinct paths,
# because "install certbot and a plugin" means something different on
# each family:
#
# - Debian/Ubuntu: the distro packages certbot and
#   python3-certbot-dns-<provider> into the same Python env. Nothing
#   else to do.
#
# - Fedora: same deal — certbot and the python3-certbot-dns-* plugins
#   are all in the Fedora repo and are current, so the venv dance
#   below is unnecessary (and would shadow a perfectly good binary).
#
# - Enterprise Linux (RHEL/Rocky/Alma/CentOS Stream): EPEL ships
#   certbot, but its Python isolation doesn't match pip3's default
#   install dir, so a separately-pip'd plugin never gets discovered by
#   the EPEL certbot binary (symptom: `certbot: error: unrecognized
#   arguments: --dns-<provider>-...`). Workaround: certbot + plugin
#   both go into a /opt/certbot venv, and we symlink /usr/bin/certbot
#   to the venv binary so the system PATH (and the certbot-renew.timer's
#   ExecStart) sees it. The EPEL `certbot` RPM is still installed for
#   the renewal timer unit it ships at
#   /usr/lib/systemd/system/certbot-renew.timer — the binary it
#   provides gets shadowed by the venv symlink.

- name: Classify the target for certbot packaging purposes
  ansible.builtin.set_fact:
    # Enterprise Linux == RedHat family minus Fedora.
    openzro_relay_certbot_needs_venv: "{{ ansible_os_family == 'RedHat' and ansible_distribution != 'Fedora' }}"

- name: Derive provider plugin package names from cert provider key
  ansible.builtin.set_fact:
    _openzro_relay_certbot_plugin_pip: "{{ openzro_relay_cert_provider | regex_replace('^certbot_dns_(.+)$', 'certbot-dns-\\1') }}"
    _openzro_relay_certbot_plugin_distro: "{{ openzro_relay_cert_provider | regex_replace('^certbot_dns_(.+)$', 'python3-certbot-dns-\\1') }}"

- name: Install certbot + provider plugin from the distro repo
  ansible.builtin.package:
    name:
      - certbot
      - "{{ _openzro_relay_certbot_plugin_distro }}"
    state: present
  when: not openzro_relay_certbot_needs_venv | bool

- name: Install python venv prereqs + EPEL certbot (Enterprise Linux)
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - augeas-libs
      - certbot
    state: present
  when: openzro_relay_certbot_needs_venv | bool

- name: Create certbot venv (Enterprise Linux)
  ansible.builtin.command:
    cmd: python3 -m venv /opt/certbot
    creates: /opt/certbot/bin/activate
  when: openzro_relay_certbot_needs_venv | bool

# `state: latest` is intentional: the EPEL `certbot` RPM (whose
# binary we shadow via the symlink below) lags upstream by enough
# that recent DNS plugins reject its CLI arg list, and operators
# expect new EFF cert+plugin behaviour to land on `--tags certbot`
# reruns without manual version bumps to this role.
- name: Install certbot + provider plugin into venv (Enterprise Linux)
  ansible.builtin.pip:
    name:
      - pip
      - certbot
      - "{{ _openzro_relay_certbot_plugin_pip }}"
    state: latest  # noqa package-latest
    virtualenv: /opt/certbot
  when: openzro_relay_certbot_needs_venv | bool

- name: Symlink venv certbot to /usr/bin (Enterprise Linux)
  ansible.builtin.file:
    src: /opt/certbot/bin/certbot
    dest: /usr/bin/certbot
    state: link
    force: true
  when: openzro_relay_certbot_needs_venv | bool
