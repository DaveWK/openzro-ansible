---
# Certbot DNS-01 issuance dispatcher. Called from tasks/main.yml when
# openzro_relay_cert_provider != "none". Each provider file owns its
# own pip plugin install, auth setup, and certbot certonly invocation
# — keeping the per-provider knobs adjacent to where they're used
# makes the role easier to extend (drop a new provider by adding a
# tasks/certbot/<name>.yml + a couple defaults).

- name: Sanity — ACME email is required when certbot is enabled
  ansible.builtin.assert:
    that:
      - openzro_relay_acme_email | default('') | length > 0
      - openzro_relay_public_address | default(openzro_public_domain | default('')) | length > 0
    fail_msg: >-
      openzro_relay_cert_provider={{ openzro_relay_cert_provider }} requires
      openzro_relay_acme_email and openzro_relay_public_address (or
      openzro_public_domain as fallback) to be set.

- name: Compute cert lineage path for the relay's public address
  ansible.builtin.set_fact:
    _openzro_relay_cert_lineage: "/etc/letsencrypt/live/{{ openzro_relay_public_address | default(openzro_public_domain) }}"

- name: Check whether a cert already exists for this lineage
  ansible.builtin.stat:
    path: "{{ _openzro_relay_cert_lineage }}/cert.pem"
  register: _openzro_relay_cert_stat

- name: Install certbot + provider DNS plugin
  ansible.builtin.import_tasks: install.yml

- name: Issue / renew cert (Cloud DNS / Google)
  ansible.builtin.import_tasks: google.yml
  when: openzro_relay_cert_provider == "certbot_dns_google"

- name: Issue / renew cert (Route53 / AWS)
  ansible.builtin.import_tasks: route53.yml
  when: openzro_relay_cert_provider == "certbot_dns_route53"

- name: Issue / renew cert (Cloudflare)
  ansible.builtin.import_tasks: cloudflare.yml
  when: openzro_relay_cert_provider == "certbot_dns_cloudflare"

# certbot ships its own renewal timer; we only need to make sure it's
# running. The unit is certbot.timer on Debian/Ubuntu and
# certbot-renew.timer on RHEL-family — ask systemd which one landed
# rather than mapping distro to name, which also covers the case where
# a host has certbot from a source that names it differently.
- name: Detect the certbot renewal timer unit
  ansible.builtin.shell: >-
    systemctl list-unit-files --type=timer
    | awk '/^certbot/ {print $1; exit}'
  register: openzro_relay_certbot_timer
  changed_when: false

- name: Ensure the certbot renewal timer is enabled
  ansible.builtin.systemd:
    name: "{{ openzro_relay_certbot_timer.stdout }}"
    enabled: true
    state: started
  when: openzro_relay_certbot_timer.stdout | length > 0
