---
# Dispatcher. The dashboard installs from a distro package on
# Debian-family hosts and from the upstream container image
# everywhere else — see defaults/main.yml for why that asymmetry
# exists (there is no dashboard rpm).
#
# nginx is a separate role. It either serves the unpacked static
# bundle from disk (package method) or reverse-proxies to the
# container on loopback (podman/docker) — openzro_nginx works that
# out from openzro_dashboard_install_method, so nothing extra to set.

- name: Validate the requested install method
  ansible.builtin.assert:
    that:
      - openzro_dashboard_install_method in ["auto", "package", "podman", "docker"]
    fail_msg: >-
      openzro_dashboard_install_method must be one of: auto, package,
      podman, docker. Got: '{{ openzro_dashboard_install_method }}'.

- name: Resolve the effective install method
  ansible.builtin.set_fact:
    openzro_dashboard_method: >-
      {{ openzro_dashboard_install_method
         if openzro_dashboard_install_method != 'auto'
         else ('package' if ansible_os_family == 'Debian' else 'podman') }}

- name: Refuse the package method where no dashboard package exists
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
    fail_msg: >-
      openzro_dashboard_install_method=package needs the
      `openzro-dashboard` package, which pkg.openzro.io publishes in
      its APT repo only — the rpm repo has no dashboard package at
      all. On {{ ansible_distribution }} use `podman` (the default
      under `auto`) or `docker`.
  when: openzro_dashboard_method == "package"

- name: Install the dashboard from the distro package
  ansible.builtin.include_tasks: install-package.yml
  when: openzro_dashboard_method == "package"

- name: Install the dashboard as a podman container
  ansible.builtin.include_tasks: install-podman.yml
  when: openzro_dashboard_method == "podman"

- name: Install the dashboard as a docker container
  ansible.builtin.include_tasks: install-docker.yml
  when: openzro_dashboard_method == "docker"
