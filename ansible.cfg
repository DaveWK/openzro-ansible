[defaults]
inventory = inventories/lab
roles_path = roles
host_key_checking = False
# `stdout_callback = yaml` used to resolve to community.general.yaml,
# which was removed in community.general 12 — on a current collection
# set every ansible-playbook run died before its first task. The
# built-in replacement has been in ansible-core since 2.13.
stdout_callback = default
result_format = yaml
forks = 10
retry_files_enabled = False
deprecation_warnings = True

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
